[core]
preferred_decoration_mode = server
plugins = autostart command core decoration grid move place resize switcher window-rules wm-actions wproto foreign-toplevel alpha animate expo vswitch blur wobbly winshadows zoom squeezimize

[animate]
open_animation = zoom
close_animation = zoom
minimize_animation = squeezimize
squeezimize_duration = 700ms circle

[blur]
# Método de blur: 'kawase' es el más balanceado entre calidad/rendimiento
method = kawase

# INTENSIDAD: Ajusta estos dos valores
# El radio define qué tan lejos llega el difuminado
radius = 7
# Las iteraciones definen cuántas veces se aplica el filtro (más = más suave)
iterations = 5

# Opcional: blur en el modo 'expo' o 'switcher'
blur_by_default = all

[command]
binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = brightnessctl set +5%
binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = brightnessctl set 5%-

# Volumen
binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Multimedia
binding_media_play = KEY_PLAYPAUSE
command_media_play = playerctl play-pause
binding_media_next = KEY_NEXTSONG
command_media_next = playerctl next
binding_media_prev = KEY_PREVIOUSSONG
command_media_prev = playerctl previous

# Launchpad
binding_launchpad = <super> KEY_SPACE
command_launchpad = /home/horacio/Desarrollo/austral-os/horizon/build/apps/launchpad/launchpad

[input]
xkb_layout=us

[output:eDP-1]
mode=1920x1080@60
position=299,1437
transform=normal

[output:HDMI-A-1]
mode=2560x1440@60
position=0,0
transform=normal

[winshadows]
clip_shadow_inside = false
enabled_views = type is "toplevel"
include_undecorated_views = true
shadow_radius = 50
shadow_color = \#00000080
vertical_offset = 15
horizontal_offset = 0
glow_enabled = false
